name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  browser-smoke:
    name: Chromium clipboard smoke · Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y xvfb xauth
      - run: xvfb-run -a env BROWSER_SMOKE_HEADED=1 node tests/browser_smoke.mjs examples/demo.xiumi.json
      - run: xvfb-run -a env BROWSER_SMOKE_HEADED=1 node tests/browser_smoke.mjs examples/image-draft.xiumi.json
