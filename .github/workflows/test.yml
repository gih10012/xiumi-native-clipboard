name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python3 -m unittest discover -s tests -v
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y xvfb xauth
      - run: xvfb-run -a env BROWSER_SMOKE_HEADED=1 node tests/browser_smoke.mjs examples/demo.xiumi.json
